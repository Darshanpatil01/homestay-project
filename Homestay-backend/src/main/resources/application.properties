spring.application.name=Homestay-backend


server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

application.jwt.secret=${JWT_SECRET}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate and JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# PostgreSQL Hibernate Configuration
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JSON Date and Time Configuration
spring.jackson.time-zone=Asia/Kolkata

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Upload Directory
application.upload.directory=uploads

# JWT Configuration
application.security.jwt.secret=${JWT_SECRET:VGhpc0lzQVN0YXlOZXN0RGV2ZWxvcG1lbnRTZWNyZXRLZXlGb3JKV1Q=}
application.security.jwt.expiration=86400000

# Error Response Configuration
server.error.include-message=always
server.error.include-binding-errors=always


# Clean error responses
server.error.include-stacktrace=never
server.error.include-exception=false
